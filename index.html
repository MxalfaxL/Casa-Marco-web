<script>(() => {
  'use strict';
  const status = document.getElementById('status');
  const progress = document.getElementById('progress');
  const retry = document.getElementById('retry');
  const manifest = JSON.parse(document.getElementById('encrypted-parts').textContent);
  const hex = bytes => Array.from(new Uint8Array(bytes), b => b.toString(16).padStart(2, '0')).join('');
  const digest = async bytes => hex(await crypto.subtle.digest('SHA-256', bytes));
  let busy = false;
  async function load() {
    if (busy) return;
    busy = true;
    retry.hidden = true;
    progress.hidden = false;
    progress.value = 0;
    status.textContent = 'Caricamento…';
    const controller = new AbortController();
    try {
      if (!crypto.subtle) throw new Error('HTTPS required');
      const parts = new Array(manifest.parts.length);
      let next = 0;
      let completed = 0;
      async function worker() {
        while (next < manifest.parts.length) {
          if (controller.signal.aborted) throw new Error('Download cancelled');
          const index = next++;
          const part = manifest.parts[index];
          if (!/^assets\/[a-f0-9]{16}\/part-\d{3}\.txt$/.test(part.path)) throw new Error('Invalid path');
          const timeout = setTimeout(() => controller.abort(), 30000);
          try {
            const response = await fetch(new URL(part.path, location.href), {credentials:'omit', redirect:'error', signal:controller.signal});
            if (!response.ok) throw new Error('Download failed');
            const bytes = new Uint8Array(await response.arrayBuffer());
            if (bytes.length !== part.size || await digest(bytes) !== part.sha256) throw new Error('Incomplete download');
            if (controller.signal.aborted) throw new Error('Download cancelled');
            parts[index] = bytes;
            completed += bytes.length;
            progress.value = Math.round(completed / manifest.size * 100);
            status.textContent = `Caricamento… ${progress.value}%`;
          } finally {
            clearTimeout(timeout);
          }
        }
      }
      await Promise.all(Array.from({length:Math.min(4, parts.length)}, () => worker()));
      const bytes = new Uint8Array(manifest.size);
      let offset = 0;
      for (const part of parts) { bytes.set(part, offset); offset += part.length; }
      if (offset !== manifest.size || await digest(bytes) !== manifest.sha256) throw new Error('Invalid package');
      const html = new TextDecoder('utf-8', {fatal:true}).decode(bytes);
      if (!html.startsWith('<!doctype html>') || !html.includes('id="encrypted-project"')) throw new Error('Invalid encrypted page');
      document.open();
      document.write(html);
      document.close();
    } catch {
      controller.abort();
      status.textContent = 'Caricamento non riuscito. Controlla la connessione e riprova.';
      progress.hidden = true;
      retry.hidden = false;
    } finally {
      busy = false;
    }
  }
  retry.addEventListener('click', load);
  load();
})();
</script>
