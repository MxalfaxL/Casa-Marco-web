<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Casa Marco</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#23382f;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}main{width:100%;max-width:360px}h1{font:36px/1.2 Georgia,serif;margin:0 0 32px}label{display:block;font-size:14px;margin:20px 0 8px}input,button{width:100%;min-height:50px;font:inherit;border-radius:8px}input{box-sizing:border-box;padding:12px;background:#fffefa;border:1px solid #c5ccc1;color:#23382f}button{margin-top:24px;border:0;background:#23382f;color:#fff;cursor:pointer}button:disabled{opacity:.65;cursor:wait}input:focus-visible,button:focus-visible{outline:3px solid #94785d;outline-offset:3px}.error{color:#9d302d;font-size:14px;margin:14px 0 0}.error:empty{display:none}noscript p{color:#9d302d}
</style>
</head>
<body>
<main id="accesso">
<h1>Casa Marco</h1>
<form id="login-form">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required aria-describedby="login-message">
<button id="enter" type="submit">Entra</button>
<p id="login-message" class="error" role="alert" aria-live="polite"></p>
</form>
<noscript><p>Per aprire la presentazione serve JavaScript. Usa Safari o un altro browser completo.</p></noscript>
</main>
<script id="encrypted-project" type="application/json">{"version":2,"kdf":"PBKDF2-SHA256","iterations":600000,"cipher":"AES-256-GCM","salt":"fEqXj4XInGUuYgQS+/8fTg==","catalog":{"iv":"9V3EM5PtqzCyJQ/K","aad":"catalog","size":30542,"sha256":"c8f043716881390d29487e5b7b85bd121d24913d81c31f75a522a055861e822a","parts":[{"path":"vault/v2/c8f043716881390d29487e5b7b85bd121d24913d81c31f75a522a055861e822a.bin","size":30542,"sha256":"c8f043716881390d29487e5b7b85bd121d24913d81c31f75a522a055861e822a"}]}}</script>
<script>(() => {
  'use strict';
  const form=document.getElementById('login-form');
  const input=document.getElementById('password');
  const button=document.getElementById('enter');
  const message=document.getElementById('login-message');
  const configNode=document.getElementById('encrypted-project');
  const config=JSON.parse(configNode.textContent);
  const configMarkup=configNode.outerHTML;
  const protectedSource='<!doctype html>\n'+document.documentElement.outerHTML;
  const PREFIX='CasaMarco:2:PBKDF2-SHA256:600000:AES-256-GCM:';
  const decode=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
  const encode=bytes=>{let value='';for(let i=0;i<bytes.length;i+=32768)value+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(value);};
  const hex=bytes=>Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');
  const digest=async bytes=>hex(await crypto.subtle.digest('SHA-256',bytes));
  const cache=new Map();
  let busy=false;
  const problem=()=>Object.assign(new Error('Download failed'),{downloadFailure:true});
  async function fetchPart(part,controller) {
    if(!/^vault\/v2\/[a-f0-9]{64}\.bin$/.test(part.path)||!Number.isInteger(part.size)||part.size<1||part.size>262144)throw problem();
    if(cache.has(part.path))return cache.get(part.path);
    let bytes;
    if(config.embedded){
      if(!Object.hasOwn(config.embedded,part.path))throw problem();
      bytes=decode(config.embedded[part.path]);
    }else{
      const timer=setTimeout(()=>controller.abort(),30000);
      try{
        const response=await fetch(new URL(part.path,location.href),{credentials:'omit',redirect:'error',signal:controller.signal});
        if(!response.ok)throw problem();
        bytes=new Uint8Array(await response.arrayBuffer());
      }catch{throw problem();}finally{clearTimeout(timer);}
    }
    if(controller.signal.aborted||bytes.length!==part.size||await digest(bytes)!==part.sha256)throw problem();
    cache.set(part.path,bytes);return bytes;
  }
  async function openArtifact(descriptor,key,controller,expectedAAD) {
    if(descriptor.aad!==expectedAAD||!Array.isArray(descriptor.parts)||!descriptor.parts.length||descriptor.parts.length>256||!Number.isInteger(descriptor.size)||descriptor.size>64*1024*1024)throw problem();
    const bytes=new Uint8Array(descriptor.size);let offset=0;
    for(const part of descriptor.parts){const block=await fetchPart(part,controller);bytes.set(block,offset);offset+=block.length;}
    if(offset!==bytes.length||await digest(bytes)!==descriptor.sha256)throw problem();
    return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(descriptor.iv),additionalData:new TextEncoder().encode(PREFIX+expectedAAD),tagLength:128},key,bytes));
  }
  form.addEventListener('submit',async event=>{
    event.preventDefault();if(busy)return;
    if(!window.crypto?.subtle){message.textContent='Apri il collegamento HTTPS in Safari o in un browser aggiornato.';return;}
    if(!input.value){message.textContent='Inserisci la password.';return;}
    busy=true;button.disabled=true;button.textContent='Apertura…';message.textContent='';input.removeAttribute('aria-invalid');
    const controller=new AbortController();let passwordBytes;let stage='password';
    try{
      if(config.version!==2||config.kdf!=='PBKDF2-SHA256'||config.iterations!==600000||config.cipher!=='AES-256-GCM'||decode(config.salt).length!==16)throw problem();
      passwordBytes=new TextEncoder().encode(input.value);input.value='';input.removeAttribute('value');
      const base=await crypto.subtle.importKey('raw',passwordBytes,'PBKDF2',false,['deriveKey']);passwordBytes.fill(0);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(config.salt),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      const catalogBytes=await openArtifact(config.catalog,key,controller,'catalog');
      const catalog=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(catalogBytes));catalogBytes.fill(0);stage='assets';
      if(catalog.version!==2||!catalog.project?.images)throw problem();
      const appBytes=await openArtifact(catalog.presentation,key,controller,'presentation');
      const template=new TextDecoder('utf-8',{fatal:true}).decode(appBytes);appBytes.fill(0);
      if(!template.startsWith('<!doctype html>')||template.split('__CASA_PROJECT_JSON__').length!==2)throw problem();
      const ids=Object.keys(catalog.project.images);let next=0,completed=0;
      async function worker(){
        while(next<ids.length){
          if(controller.signal.aborted)throw problem();
          const id=ids[next++],image=catalog.project.images[id];
          if(!['image/jpeg','image/png'].includes(image.mime))throw problem();
          const bytes=await openArtifact(image.asset,key,controller,'render:'+id);
          const src=`data:${image.mime};base64,${encode(bytes)}`;bytes.fill(0);
          if(controller.signal.aborted)throw problem();
          catalog.project.images[id]={src,width:image.width,height:image.height};
          completed++;button.textContent=`Apertura… ${Math.round(completed/ids.length*100)}%`;
        }
      }
      await Promise.all(Array.from({length:Math.min(4,ids.length)},()=>worker()));
      let offlineSource=protectedSource;
      if(!config.embedded){
        const embedded=Object.fromEntries([...cache].map(([path,bytes])=>[path,encode(bytes)]));
        const inlineJSON=JSON.stringify({...config,embedded});
        const inlineMarkup=configMarkup.replace(configNode.textContent,()=>inlineJSON);
        offlineSource=protectedSource.replace(configMarkup,()=>inlineMarkup);
      }
      window.__CASA_ENCRYPTED_SOURCE__=offlineSource;
      const projectJSON=JSON.stringify(catalog.project).replace(/</g,'\\u003c');
      let html=template.replace('__CASA_PROJECT_JSON__',()=>projectJSON);
      html=html.replace('<head>','<head><meta http-equiv="Content-Security-Policy" content="connect-src \'none\'; form-action \'none\'">');
      document.open();document.write(html);document.close();
    }catch(error){
      controller.abort();input.value='';
      if(stage==='password'&&!error.downloadFailure){input.setAttribute('aria-invalid','true');message.textContent='password errata';}
      else message.textContent='Caricamento non riuscito. Controlla la connessione e riprova.';
      input.focus();
    }finally{passwordBytes?.fill(0);busy=false;button.disabled=false;button.textContent='Entra';}
  });
})();
</script>
</body>
</html>
